<!DOCTYPE html>
<html lang="en">
<head>
<title>Something cool</title>
        <link href='https://fonts.googleapis.com/css?family=Press+Start+2P' rel='stylesheet'>
        <link rel="shortcut icon" type="image/x-icon" href="static/icon.gif" />
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


</head>
<body bgcolor="#000000">
<style>
    *{
        border: 3px red solid;
    }
body {
	background-image: url("static/bg2.png");
    background-repeat: repeat;
    animation: cursorcursornojutsu 0.3s infinite;
    font-family: 'Press Start 2P';
    /* margin: 10px; */
    /* height: 100%; */
}
html{
    overflow: hidden;
}
.container{
    display:grid;
    width: 100vw;
    height: 100vh;
    grid-template-columns: repeat(12, minmax(0,1fr));
    grid-template-rows: repeat(3,minmax(0,1fr));
    column-gap: 1vw;
    row-gap: 1vh;
}
img{
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
}
.container > div{
    transition: transform 0.5s;
    min-width: 0;
    min-height: 0;

}
.container > div:hover{
    transform: scale(1.1);
}
.linear-text-gradient {
            animation: idkwhattoname 2s infinite;
            
            
        }
@keyframes idkwhattoname {
    0%{
        background: linear-gradient(to right, red,purple, blue);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        
    }
    50%{
        background: linear-gradient(to right, blue, red, purple);
        -webkit-background-clip: text; 
        background-clip: text;
        color: transparent;
    }
    100%{
        background: linear-gradient(to right, purple,blue,red);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

}
@keyframes cursorcursornojutsu {
                0%{
                    cursor: e-resize;

                }14%{
                    cursor: ne-resize;
                }28%{
                    cursor: n-resize;
                }43%{
                    cursor: nw-resize;
                }56%{
                    cursor: w-resize;
                }70%{
                    cursor: sw-resize;
                }85%{
                    cursor: s-resize;
                }100%{
                    cursor: se-resize;
                    }
            }
@media (max-width: 1000px) {
    .container{
        display: flex;
        flex-direction: column;
    }
}
</style>

<div class="container">

    <div id="secoright" style="grid-row: 2; grid-column: 8/11;"><img src="static/mob.jpg" style="border: 1px solid red;" id="heh" ></div>
    <div style="grid-row: 3; grid-column: 2 / 11 ;background: linear-gradient(0deg,RGBA(0,0,50,1)1%, RGBA(0,0,0,1)70%);color: white;">
        Check out some other projects from me:
        <ul>
            <li><a href="Apple tree/index.htm">The apple tree</a>
            </li>
            <br>
            <li>CS50w:</li>
            <ul><li><a href="Project 0/index.html">Google replica</a></li></ul>
            <br>
            <li><a href="https://github.com/hugalalahuhu">Github</a></li>
        </ul>
    </div>
</div>

    $(document).ready(function(){
        $("#heh").hover(function(){
            $(this).attr("src","static/wh.jpg")
        })
    })
</script>
</body>
</html>
